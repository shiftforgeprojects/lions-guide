<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lions Guide: understand Lionism</title>
<meta name="description" content="A free guide that explains Lions Clubs International in plain words: what Lions do, how to join, and the rules and meetings behind it.">
<meta name="theme-color" content="#003c73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lions Guide">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark" id="mark"><img id="logo" src="logo.png" alt="Lions Clubs International logo" hidden><span aria-hidden="true">L</span></div>
    <div class="ttl"><b>Lions Guide <span class="dist">(District 317F)</span></b><small>Understand Lionism in plain words</small></div>
    <div class="vtag" id="ver" aria-label="Version"></div>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="by">Created by Ln. Mukesh Kumar Pandey</div>
  <div class="seg" role="group" aria-label="Who are you?">
    <button type="button" data-mode="new" aria-pressed="true">I'm new to Lions</button>
    <button type="button" data-mode="member" aria-pressed="false">I'm a member</button>
  </div>
</header>

<main id="chat" role="log" aria-live="polite" aria-label="Conversation"></main>

<form class="composer" id="form" autocomplete="off">
  <button class="iconbtn" id="topicsBtn" type="button" aria-label="Browse topics">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
  </button>
  <div class="field">
    <label class="sr" for="q">Ask a question about Lions</label>
    <input id="q" type="text" inputmode="text" enterkeyhint="send" placeholder="Ask about Lions…" maxlength="300" autocapitalize="sentences">
    <button id="mic" type="button" aria-label="Speak your question">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </div>
  <button id="send" type="submit" aria-label="Send">
    <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</form>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <header><h3 id="sheetTitle"></h3>
    <button class="iconbtn" id="sheetClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="body" id="sheetBody"></div>
</section>

<noscript><p style="padding:16px">This guide needs JavaScript. You can read the official material at lionsclubs.org.</p></noscript>
<script src="config.js"></script>
<script src="kb.js"></script>
<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
